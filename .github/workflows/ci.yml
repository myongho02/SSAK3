name: CI

# Pull Request 또는 main/feature 브랜치 push 시 자동 실행
# 학회 발표 멘트: "GitHub Actions가 git push 시 자동으로 빌드/검증합니다"

on:
  push:
    branches: [main, "feature/**", "phase/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint check (warnings only — 발표 시연 안전성 우선)
        run: |
          # 치명적 에러(F-prefix 문법 오류)만 체크해서 빌드 차단
          # 스타일 경고는 출력만 하고 실패 처리하지 않음
          ruff check --select=E9,F63,F7,F82 api/ worker/ dashboard/ benchmark.py || exit 1
          # 추가 정보용 경고 출력 (실패 처리 X)
          ruff check api/ worker/ dashboard/ --output-format=github || true

  build:
    name: Docker Compose Build 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build all services (image cache enabled)
        run: |
          # 6개 서비스(api, worker-1/2/3, dashboard)의 Dockerfile을 빌드 검증
          # ngrok은 외부 이미지라 별도 빌드 불필요 (profile로 분리됨)
          docker compose build --parallel api worker-1 dashboard
      - name: Compose config 유효성
        run: docker compose config --quiet

  smoke-test:
    name: API Smoke Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Start core services (API + RabbitMQ만, Worker 제외 — CI 시간 절약)
        run: |
          docker compose up -d --build rabbitmq api
          # API healthy 대기 (최대 60초)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/ > /dev/null; then
              echo "API ready after ${i}*2s"
              break
            fi
            sleep 2
          done
      - name: 기본 endpoint smoke
        run: |
          # 루트 endpoint
          curl -sf http://localhost:5001/ | grep -q "running" || exit 1
          # 회원가입 → 로그인 (Phase G/H 검증)
          REG=$(curl -sf -X POST http://localhost:5001/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"citest","password":"CiTest123"}')
          echo "$REG" | grep -q "회원가입 완료" || (echo "❌ 회원가입 실패: $REG" && exit 1)
          TOKEN=$(echo "$REG" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          # /auth/me (인증 검증)
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:5001/auth/me \
            | grep -q "citest" || exit 1
          echo "✅ 모든 smoke test 통과"
      - name: 로그 수집 (실패 시 디버깅용)
        if: failure()
        run: |
          docker compose logs api
          docker compose logs rabbitmq
