name: CI

# Pull Request 또는 main/feature 브랜치 push 시 자동 실행
# CI는 "빌드가 깨지지 않는지" 빠르게 검증만 함.
# 무거운 worker 이미지(torch+transformers+모델)는 release에서만 빌드.

on:
  push:
    branches: [main, "feature/**", "phase/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Python Lint (정보용)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint check (정보용 — 항상 통과)
        # 학회용 빌드 안정성 우선: lint 결과는 출력하되 빌드 실패시키지 않음
        run: |
          ruff check api/ worker/ dashboard/ benchmark.py --output-format=github || true
        continue-on-error: true

  build-light:
    name: Docker Build 검증 (api + dashboard만)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build api 이미지
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          tags: ssak3-api:ci
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,scope=ci-api,mode=max
      - name: Build dashboard 이미지
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: false
          tags: ssak3-dashboard:ci
          cache-from: type=gha,scope=ci-dashboard
          cache-to: type=gha,scope=ci-dashboard,mode=max
      - name: Compose 설정 유효성
        run: docker compose config --quiet

  smoke-test:
    name: API Smoke Test
    runs-on: ubuntu-latest
    needs: [build-light]
    steps:
      - uses: actions/checkout@v4
      - name: API + RabbitMQ만 가동 (worker 제외 — CI 시간/디스크 절약)
        run: |
          docker compose up -d --build rabbitmq api
      - name: API healthy 대기 (최대 120초)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5001/ > /dev/null 2>&1; then
              echo "✅ API ready after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "❌ API가 120초 내에 준비되지 않음"
          docker compose logs api
          exit 1
      - name: 회원가입 + /auth/me 검증
        run: |
          # API의 jsonify는 기본 ensure_ascii=True 라 한글이 \uXXXX 로 escape됨.
          # raw 한글 grep으로는 매칭 안 되므로 구조적 검증(키 존재 + 값 매칭)으로 변경.
          REG=$(curl -sf -X POST http://localhost:5001/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"citest","password":"CiTest123"}')
          echo "회원가입 응답: $REG"
          TOKEN=$(echo "$REG" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('token'), 'token 키 없음'; print(d['token'])")
          [ -n "$TOKEN" ] || (echo "❌ 회원가입 실패 (token 없음): $REG" && exit 1)
          ME=$(curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:5001/auth/me)
          echo "/auth/me 응답: $ME"
          echo "$ME" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('username')=='citest', f'username 불일치: {d}'"
          echo "✅ 인증 흐름 통과"
      - name: 실패 시 로그 수집
        if: failure()
        run: |
          docker compose logs api
          docker compose logs rabbitmq

  # ========== M8 회귀 평가 (K1 자동 실행) ==========
  # main 브랜치 + workflow_dispatch에만 실행 (worker 빌드 시간 큼)
  # PR/feature 브랜치에서는 smoke test까지만
  regression-eval:
    name: K1 회귀 평가 (Worker 빌드 + 12케이스 분류 정확도)
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (worker 이미지용)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
      - name: 전체 서비스 가동 (worker 포함)
        run: |
          docker compose up -d --build
          # Worker 모델 로딩 대기 (PREDOWNLOAD_MODELS=true 기본값이라 빌드 시 포함)
          for i in $(seq 1 60); do
            if docker compose logs worker-1 2>&1 | grep -q "큐 대기 중"; then
              echo "✅ Worker-1 ready after ${i}*5s"
              break
            fi
            sleep 5
          done
      - name: K1 평가 실행
        run: |
          python3 eval/eval_runner.py | tee /tmp/eval_output.txt
      - name: M6 리포트 생성
        run: |
          python3 eval/eval_report.py | tee /tmp/report_output.txt
      - name: 정확도 회귀 검출 (Loose Accuracy 90% 미만이면 실패)
        run: |
          python3 -c "
          import json
          with open('eval/results.json') as f:
              d = json.load(f)
          loose = d.get('loose_accuracy', 0)
          strict = d.get('strict_accuracy', 0)
          print(f'Strict: {100*strict:.1f}% / Loose: {100*loose:.1f}%')
          assert loose >= 0.90, f'❌ 회귀 검출! Loose Accuracy가 90% 미만으로 떨어짐: {100*loose:.1f}%'
          print('✅ 회귀 없음 — Loose Accuracy ≥ 90%')
          "
      - name: 리포트 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-eval-results
          path: |
            eval/results.json
            eval/report.json
            /tmp/eval_output.txt
            /tmp/report_output.txt
      - name: PR/커밋 요약에 결과 추가
        if: always()
        run: |
          {
            echo "## 📊 K1 회귀 평가 결과"
            echo ""
            echo '```'
            tail -40 /tmp/report_output.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
