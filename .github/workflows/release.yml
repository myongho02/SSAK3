name: Release (GHCR 이미지 자동 푸시)

# main 브랜치 push 또는 v* 태그 시 자동 실행
# 6개 서비스(api, worker, dashboard) Docker 이미지를 GitHub Container Registry에 푸시
# 학회 발표 멘트: "git push만 하면 이미지가 GHCR에 자동 저장되어 어디서든 가져다 쓸 수 있습니다"

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:  # 수동 실행 버튼

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/ssak3

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR 푸시 권한
    strategy:
      matrix:
        # 6개 컨테이너 중 빌드 대상 3종 (worker는 단일 이미지를 3개 인스턴스로 사용)
        service: [api, worker, dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx (멀티 플랫폼 지원)
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 메타데이터 (자동 태깅)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64    # x86 서버 + Apple Silicon 모두 지원
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    name: 릴리즈 요약 출력
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: success()
    steps:
      - name: 출력
        run: |
          echo "## 🚀 릴리즈 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "다음 이미지가 GHCR에 푸시되었습니다:" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/ssak3-api:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/ssak3-worker:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/ssak3-dashboard:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "운영 서버에서 \`docker compose -f docker-compose.prod.yml pull && up -d\`로 배포 가능." >> $GITHUB_STEP_SUMMARY
