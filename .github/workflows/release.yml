name: Release (GHCR 이미지 자동 푸시)

# main 브랜치 push 또는 v* 태그 시 자동 실행.
# 학회용 안정성: amd64 단일 아키만 빌드 (멀티아키 시 디스크 부족 위험).
# 팀원이 Apple Silicon이라도 Docker Desktop의 자동 에뮬레이션으로 동작.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/ssak3

jobs:
  api:
    name: Build & Push api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (worker 이미지 대비)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & Push (amd64)
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-api
          cache-to: type=gha,scope=release-api,mode=max

  dashboard:
    name: Build & Push dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-dashboard
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & Push (amd64)
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-dashboard
          cache-to: type=gha,scope=release-dashboard,mode=max

  worker:
    name: Build & Push worker (가장 무거움 — 디스크 정리 후 진행)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (필수 — torch+transformers+모델 ~6GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-worker
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & Push (amd64, 모델 사전 다운로드 X — 첫 가동 시 자동 다운)
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # PREDOWNLOAD_MODELS=false: 빌드 시 모델 다운 안 함 (이미지 ~1.5GB로 작아짐)
          # 팀원이 첫 가동 시 컨테이너 내부에서 자동 다운 (~30초 1회만)
          build-args: |
            PREDOWNLOAD_MODELS=false
          cache-from: type=gha,scope=release-worker
          cache-to: type=gha,scope=release-worker,mode=max

  summary:
    name: 릴리즈 요약
    runs-on: ubuntu-latest
    needs: [api, dashboard, worker]
    if: always()
    steps:
      - name: 출력
        run: |
          if [ "${{ needs.api.result }}" = "success" ] && [ "${{ needs.dashboard.result }}" = "success" ] && [ "${{ needs.worker.result }}" = "success" ]; then
            echo "## 🚀 릴리즈 성공" >> $GITHUB_STEP_SUMMARY
            echo "- ghcr.io/${{ github.repository_owner }}/ssak3-api:latest" >> $GITHUB_STEP_SUMMARY
            echo "- ghcr.io/${{ github.repository_owner }}/ssak3-worker:latest" >> $GITHUB_STEP_SUMMARY
            echo "- ghcr.io/${{ github.repository_owner }}/ssak3-dashboard:latest" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ 일부 작업 실패" >> $GITHUB_STEP_SUMMARY
            echo "- api: ${{ needs.api.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- dashboard: ${{ needs.dashboard.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- worker: ${{ needs.worker.result }}" >> $GITHUB_STEP_SUMMARY
          fi
