services:
  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "5001:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared-data:/app/data

  # ========== 분산 병렬 처리 Worker 구성 ==========
  # 3개의 Worker가 동일한 RabbitMQ 큐(news_queue)에 연결되어,
  # 큐에 들어온 기사를 자동으로 분배받아 병렬 처리한다.
  # RabbitMQ의 Round-Robin 방식으로 메시지가 균등 분배됨.
  # 각 Worker는 WORKER_ID 환경변수로 구분되며, 로그에서 어떤 Worker가
  # 어떤 기사를 처리했는지 확인할 수 있다.

  worker-1:
    build: ./worker
    environment:
      - WORKER_ID=1       # 이 Worker의 고유 ID (로그 구분용)
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared-data:/app/data

  worker-2:
    build: ./worker
    environment:
      - WORKER_ID=2
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared-data:/app/data

  worker-3:
    build: ./worker
    environment:
      - WORKER_ID=3
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared-data:/app/data

  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    volumes:
      - shared-data:/app/data

volumes:
  shared-data: