services:
  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "5001:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared-data:/app/data

  worker:
    build: ./worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared-data:/app/data

  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    volumes:
      - shared-data:/app/data

volumes:
  shared-data: