services:
  rabbitmq:
    image: rabbitmq:management
    ports:
      # H3-3 운영 보안: 관리 콘솔(15672)은 외부 접근 금지를 위해 127.0.0.1에 바인딩.
      # 5672는 내부 컨테이너끼리만 통신하므로 expose로 충분 (외부 차단).
      - "127.0.0.1:15672:15672"
    expose:
      - "5672"
    environment:
      # 운영 보안: guest 기본 계정 외 운영용 자격증명을 환경변수로 (선택)
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "5001:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared-data:/app/data
    environment:
      # 운영 환경 변수 (.env에서 오버라이드 가능)
      - SSAK3_DB_PATH=/app/data/results.db
      - SSAK3_SESSION_TTL=${SSAK3_SESSION_TTL:-604800}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========== 분산 병렬 처리 Worker 구성 ==========
  # 3개의 Worker가 동일한 RabbitMQ 큐(news_queue)에 연결되어,
  # 큐에 들어온 기사를 자동으로 분배받아 병렬 처리한다.
  # RabbitMQ의 Round-Robin 방식으로 메시지가 균등 분배됨.
  # 각 Worker는 WORKER_ID 환경변수로 구분되며, 로그에서 어떤 Worker가
  # 어떤 기사를 처리했는지 확인할 수 있다.

  worker-1:
    build: ./worker
    environment:
      - WORKER_ID=1       # 이 Worker의 고유 ID (로그 구분용)
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared-data:/app/data

  worker-2:
    build: ./worker
    environment:
      - WORKER_ID=2
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared-data:/app/data

  worker-3:
    build: ./worker
    environment:
      - WORKER_ID=3
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared-data:/app/data

  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    volumes:
      - shared-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========== H1 ngrok — 외부 접속 터널 (옵션) ==========
  # 학회 시연 등 외부 사용자에게 HTTPS URL을 즉시 노출하고 싶을 때 사용.
  # 사용법:
  #   1) https://dashboard.ngrok.com 에서 회원가입(무료) → Authtoken 복사
  #   2) 프로젝트 루트에 .env 파일 생성: NGROK_AUTHTOKEN=your_token
  #   3) docker compose --profile tunnel up -d
  #   4) http://localhost:4040 에서 발급된 외부 URL 확인 (https://abc-123.ngrok-free.app)
  # 일반 가동 시에는 이 서비스가 시작되지 않음 (profile로 격리).
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    command: http dashboard:8501
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    ports:
      - "127.0.0.1:4040:4040"   # ngrok inspector (로컬에서만)
    depends_on:
      - dashboard

volumes:
  shared-data: